# Not part of the release package: Face Matcher UI, restart: unless-stopped on every service, and user: root on
# the 19 services that load a biometric engine or match templates. Since v5_4.41.1 the images run as uid 10001,
# but the licensing library reads root-only hardware identifiers, derives a different HWID and rejects the
# license ("License has different HWID than this machine"). Verified on v5_4.43.0.10149; the other 5 services
# run as uid 10001. Remove user: root once licensing works for uid 10001.
services:
  face-matcher-ui:
    image: ${FACE_MATCHER_UI_REGISTRY}face-matcher-ui:${FACE_MATCHER_UI_VERSION}
    container_name: face-matcher-ui
    restart: unless-stopped
    ports:
      - "${FACE_MATCHER_UI_PORT:-8000}:8000"
    env_file:
      - ./.env.face-matcher-ui
      # Only with the login on (README, "Turning the login on"): the client secret, KEYCLOAK_CLIENT_SECRET.
      # - ./secrets/face-matcher-ui.env
    environment:
      IDENTIFICATION_ENABLED: "${FACE_MATCHER_UI_IDENTIFICATION:-true}"
    volumes:
      - ./iengine.lic:/etc/innovatrics/iengine.lic:ro
      - ./branding/face-matcher-ui/logo-product.svg:/build/branding/logo-product.svg:ro
      - ./branding/face-matcher-ui/logo-product-without-text.svg:/build/branding/logo-product-without-text.svg:ro
      - ./branding/face-matcher-ui/favicon-product.ico:/build/branding/favicon-product.ico:ro
      - ./branding/face-matcher-ui/naming-product.json:/build/branding/naming-product.json:ro
      # Only with the login on: the key and the certificate of the UI's HTTPS, server.key and server.crt.
      # - ./secrets/tls:/certs:ro
  base:
    restart: unless-stopped
    user: root
  streamdatadbworker:
    restart: unless-stopped
  cam-1:
    restart: unless-stopped
    user: root
  cam-2:
    restart: unless-stopped
    user: root
  cam-3:
    restart: unless-stopped
    user: root
  cam-4:
    restart: unless-stopped
    user: root
  cam-5:
    restart: unless-stopped
    user: root
  cam-nx:
    restart: unless-stopped
    user: root
  graphql-api:
    restart: unless-stopped
    # Only with the APIs' authentication on and a Keycloak certificate from a private authority (README, "What stays
    # open with the login on"): the APIs trust that authority, secrets/tls/ca.crt.
    # environment:
    #   SSL_CERT_FILE: /certs/ca.crt
    # volumes:
    #   - ./secrets/tls/ca.crt:/certs/ca.crt:ro
  api:
    restart: unless-stopped
    user: root
    # Only with the APIs' authentication on and a Keycloak certificate from a private authority: as at graphql-api.
    # environment:
    #   SSL_CERT_FILE: /certs/ca.crt
    # volumes:
    #   - ./secrets/tls/ca.crt:/certs/ca.crt:ro
  detector:
    restart: unless-stopped
    user: root
  pedestrian-detector:
    restart: unless-stopped
    user: root
  extractor:
    restart: unless-stopped
    user: root
  matcher:
    restart: unless-stopped
    user: root
  face-matcher:
    restart: unless-stopped
    user: root
  liveness:
    restart: unless-stopped
    user: root
  edge-stream-processor:
    restart: unless-stopped
    user: root
  edge-streams-state-synchronizer:
    restart: unless-stopped
  pedestrian-extractor:
    restart: unless-stopped
    user: root
  object-detector:
    restart: unless-stopped
    user: root
  palm-detector:
    restart: unless-stopped
    user: root
  palm-extractor:
    restart: unless-stopped
    user: root
  db-synchronization-leader:
    restart: unless-stopped
  db-synchronization-follower:
    restart: unless-stopped
